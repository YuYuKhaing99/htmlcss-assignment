
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO FISH GAME</title>
<link rel="stylesheet" href="style.css">
</head>

<body background="gofish_pic1.png">

<div class="welcome">

    <h1>Welcome to GO FISH GAME 🎣</h1>

    <p class="welcome_text"> 
        Welcome to fishing in a Finnish style mökki with the beautiful nature!<br>
        Are you ready to catch some fish? 🐟</p>
    
    <form id="userinfo">

        <label for="username">🧑 Your Name:</label>
        <input type="text" id="username" placeholder="Enter your name" required>

        <label for="age">📅 Your Age:</label>
        <input type="number" id="age" placeholder="Enter your age" required>

        <button type="submit" id="start_button">START GAME 🎣</button>

    </form>
</div>
</body>
</html>
